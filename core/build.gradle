    "arc.util.serialization.JsonWriter\$JsonObject:JsonWriter_JsonObject", 
    "arc.util.serialization.UBJsonWriter\$JsonObject:UBJsonWriter_JsonObject", 

    "mindustry.editor.MapResizeDialog\$ResizeListener:MapResizeDialog_ResizeListener", 
    "mindustry.ui.dialogs.JoinDialog\$Server:JoinDialog_Server"
    ]
}
name: Build and Release from Branch

on:
  # 當一個 'v' 開頭的分支被 push 時觸發
  push:
    branches:
      - 'v*'

permissions:
  # 需要 write 權限才能夠建立 Tag 和 Release 並上傳檔案
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Extract Version and Tag Name from Branch
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -n -r 's/^v([0-9]+\.[0-9]+).*/\1/p')
        echo "Branch name is: $BRANCH_NAME"
        echo "Extracted version for build: $VERSION"
        echo "Tag to be created for release: $BRANCH_NAME"
        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$BRANCH_NAME" >> $GITHUB_ENV

    # <<< 修改點 1: 將建置步驟拆分，首先建置必要的 JARs >>>
    - name: Build JARs (Desktop and Server)
      # 執行 gradle 編譯，只建置 desktop 和 server
      # 這個步驟是必要的，如果失敗，整個 job 會失敗
      run: ./gradlew desktop:dist server:dist -Pbuildversion=${{ env.BUILD_VERSION }}

    # <<< 修改點 2: 獨立建置 Android APK，並允許失敗 >>>
    - name: Build Android APK (Continue on error)
      # 獨立建置 Android APK
      # continue-on-error: true 確保即使此步驟失敗，workflow 仍會繼續
      continue-on-error: true
      run: ./gradlew android:assembleRelease -Pbuildversion=${{ env.BUILD_VERSION }}

    - name: Create Release and Upload Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        prerelease: true
        # <<< 修改點 3: 新增 fail_on_unmatched_files: false >>>
        # 這可以防止在找不到 APK 檔案時 (因為 Android build 失敗) 整個 release 步驟失敗
        fail_on_unmatched_files: false
        files: |
          desktop/build/libs/*.jar
          server/build/libs/server-release.jar
          android/build/outputs/apk/release/*.apk
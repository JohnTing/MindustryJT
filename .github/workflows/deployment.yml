# .github/workflows/main-release.yml

name: Build and Release - Main

on:
  # 當一個 'v' 開頭的分支被 push 時觸發
  push:
    branches:
      - 'v*'

permissions:
  # 需要 write 權限才能夠建立 Tag 和 Release 並上傳檔案
  contents: write

jobs:
  build-and-create-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Extract Version and Tag Name from Branch
      # 從分支名稱中提取版本號和標籤名稱
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -n -r 's/^v([0-9]+\.[0-9]+).*/\1/p')
        echo "Branch name is: $BRANCH_NAME"
        echo "Extracted version for build: $VERSION"
        echo "Tag to be created for release: $BRANCH_NAME"
        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Build Desktop and Server JARs
      # 執行 gradle 編譯，只編譯 desktop 和 server
      run: ./gradlew desktop:dist server:dist -Pbuildversion=${{ env.BUILD_VERSION }}

    - name: Create Release and Upload JARs
      # 這個 action 會建立 Tag 和 Release，並上傳指定的 JAR 檔案
      uses: softprops/action-gh-release@v2
      with:
        # 要建立的 Git Tag 和 Release 的名稱
        tag_name: ${{ env.RELEASE_TAG }}
        # Release 的標題
        name: Release ${{ env.RELEASE_TAG }}
        # 將此版本標記為 "預發行版"
        prerelease: true
        # 只上傳 desktop 和 server 的檔案
        files: |
          desktop/build/libs/*.jar
          server/build/libs/server-release.jar
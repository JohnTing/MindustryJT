# .github/workflows/android-release.yml

name: Build and Release - Android

on:
  workflow_run:
    # 監聽名為 "Build and Release - Main" 的 workflow
    workflows: ["Build and Release - Main"]
    # 只有在它成功完成時才觸發
    types:
      - completed

permissions:
  # 同樣需要 write 權限才能夠 "編輯" Release (上傳檔案)
  contents: write

jobs:
  build-and-upload-apk:
    runs-on: ubuntu-latest
    # 增加一個判斷，確保觸發的 workflow 是成功 (success) 的
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
    - name: Checkout correct commit
      # 這裡的 checkout 很重要：我們需要 checkout 觸發上一個 workflow 的那個 commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Extract Version and Tag Name from Branch
      # 我們需要再次執行相同的邏輯來獲取版本號和標籤名稱
      # 這裡從 workflow_run 事件中獲取分支名稱
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -n -r 's/^v([0-9]+\.[0-9]+).*/\1/p')
        echo "Branch name is: $BRANCH_NAME"
        echo "Extracted version for build: $VERSION"
        echo "Tag to be used for release: $BRANCH_NAME"
        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Build Android APK
      # 只執行 Android 的編譯任務
      run: ./gradlew clean android:assembleRelease -Pbuildversion=${{ env.BUILD_VERSION }}

    - name: Upload APK to Existing Release
      # 再次使用 softprops/action-gh-release
      # 因為 tag_name 已經存在，這個 action 會自動找到對應的 Release 並將檔案附加進去，而不是建立新的
      uses: softprops/action-gh-release@v2
      with:
        # 指定要上傳到哪個 tag (Release)
        tag_name: ${{ env.RELEASE_TAG }}
        # 只上傳 APK 檔案
        files: |
          android/build/outputs/apk/release/*.apk
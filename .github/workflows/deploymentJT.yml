# .github/workflows/main-release.yml

name: Build and Release - Main

on:
  push:
    branches:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    # 【修改點 1】更改快取 Key (加入 -v2-)，強制捨棄之前可能已損壞或受污染的 Gradle 快取
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-v2-

    - name: Extract Version, Tag Name, and Timestamp
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^v([0-9.]+).*/\1/')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        UNIQUE_TAG="${BRANCH_NAME}-${TIMESTAMP}"

        echo "Branch name is: $BRANCH_NAME"
        echo "Extracted version for Pbuildversion: $VERSION"
        echo "Timestamp: $TIMESTAMP"
        echo "Full unique tag to be created: $UNIQUE_TAG"
        
        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$UNIQUE_TAG" >> $GITHUB_ENV

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ../bekeystore.jks

    # 【修改點 2】合併 Desktop, Server, Android 於一個指令中，並加上 clean
    # 這樣可以確保 Gradle 在同一個生命週期內完成所有解析，不會發生配置被提早鎖死的問題
    - name: Build All Targets (Desktop, Server, Android)
      id: build_all
      continue-on-error: true
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
        keystore_alias: ${{ secrets.KEYSTORE_ALIAS }}
        keystore_alias_password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: >
        ./gradlew clean desktop:dist server:dist android:assembleRelease
        -Pbuildversion=${{ env.BUILD_VERSION }}
        --stacktrace
        --no-daemon
        --no-configuration-cache

    # 根據 build_all 的結果上傳報告
    - name: Upload Android Build Reports on Failure
      if: steps.build_all.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: android-build-reports
        path: android/build/reports/
        retention-days: 7

    # 根據 build_all 的結果建立 Release 
    - name: Create Release and Upload JARs
      if: steps.build_all.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        files: |
          desktop/build/libs/*.jar
          server/build/libs/server-release.jar

    # 根據 build_all 的結果上傳 APK
    - name: Upload Android Release APK
      if: steps.build_all.outcome == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.RELEASE_TAG }}
        file: android/build/outputs/apk/release/android-release.apk
        asset_name: mindustry-android-release-${{ env.BUILD_VERSION }}.apk
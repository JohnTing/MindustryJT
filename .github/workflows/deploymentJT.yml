# .github/workflows/main-release.yml

name: Build and Release - Main

on:
  push:
    branches:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    # 使用 v3 快取鍵，確保取得全新的環境
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-v3-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-v3-

    - name: Extract Version, Tag Name, and Timestamp
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^v([0-9.]+).*/\1/')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        UNIQUE_TAG="${BRANCH_NAME}-${TIMESTAMP}"

        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$UNIQUE_TAG" >> $GITHUB_ENV

    # ==========================================
    # 階段 1：編譯並發布 Desktop 與 Server
    # ==========================================
    - name: Build Desktop and Server JARs
      run: ./gradlew clean desktop:dist server:dist -Pbuildversion=${{ env.BUILD_VERSION }} --no-daemon

    - name: Create Release and Upload JARs
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        files: |
          desktop/build/libs/*.jar
          server/build/libs/server-release.jar

    # ==========================================
    # 階段 2：深度清理 Gradle 狀態 (解決 mutate 錯誤的殺手鐧)
    # ==========================================
    - name: Clean up Gradle state before Android build
      run: |
        ./gradlew --stop
        rm -rf .gradle/configuration-cache
        rm -rf .gradle/caches

    # ==========================================
    # 階段 3：編譯並發布 Android APK
    # ==========================================
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Keystore
      # 注意：請確認您的專案 build.gradle 確實是去上一層目錄 (../) 找 bekeystore.jks
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ../bekeystore.jks

    - name: Build Android Release APK
      # 這次不加 continue-on-error，如果失敗可以直接看到真正的原因
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
        keystore_alias: ${{ secrets.KEYSTORE_ALIAS }}
        keystore_alias_password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: >
        ./gradlew android:assembleRelease
        -Pbuildversion=${{ env.BUILD_VERSION }}
        --stacktrace
        --no-daemon
        --no-configuration-cache

    - name: Upload Android Build Reports on Failure
      if: failure() # 只有在前面步驟失敗時才會執行此步
      uses: actions/upload-artifact@v4
      with:
        name: android-build-reports
        path: android/build/reports/
        retention-days: 7

    - name: Upload Android Release APK
      # 將 APK 附加到上面剛剛建立的同一個 Release 中
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.RELEASE_TAG }}
        file: android/build/outputs/apk/release/android-release.apk
        asset_name: mindustry-android-release-${{ env.BUILD_VERSION }}.apk
# .github/workflows/main-release.yml

name: Build and Release - Main

on:
  push:
    branches:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Extract Version, Tag Name, and Timestamp
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^v([0-9.]+).*/\1/')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        UNIQUE_TAG="${BRANCH_NAME}-${TIMESTAMP}"

        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$UNIQUE_TAG" >> $GITHUB_ENV

    - name: Clone Arc dependency
      run: |
        ARC_HASH=$(grep '^archash=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
        git clone https://github.com/Anuken/Arc ../Arc
        cd ../Arc
        if [ -n "$ARC_HASH" ]; then
          git checkout "$ARC_HASH"
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ../bekeystore.jks

    # =================================================================
    # == 🟢 核心修正 1：強制在 CI 環境中將 Gradle 降級到穩定版本 (8.6)
    # 避免 Gradle 9.x/10 與舊版 Android Gradle Plugin 產生依賴變更衝突
    # =================================================================
    - name: Downgrade Gradle Wrapper to 8.6
      run: |
        echo "Forcing Gradle 8.6 to prevent configuration mutation errors..."
        sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-bin.zip|' gradle/wrapper/gradle-wrapper.properties

    # =================================================================
    # == 🟢 核心修正 2：編譯時加入 --no-configuration-cache 與 --no-parallel
    # 避免舊版 AGP 在多執行緒下發生的生命週期解析錯誤
    # =================================================================
    - name: Build All Artifacts (Desktop, Server, Android)
      id: build_all
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
        keystore_alias: ${{ secrets.KEYSTORE_ALIAS }}
        keystore_alias_password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: >
        ./gradlew desktop:dist server:dist android:assembleRelease
        -Pbuildversion=${{ env.BUILD_VERSION }}
        --no-configuration-cache
        --no-parallel
        --stacktrace
        
    - name: Upload Build Reports on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: '**/build/reports/'
        retention-days: 7

    - name: Create Release and Upload All Files
      id: create_release
      uses: softprops/action-gh-release@v2
      if: success() 
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        files: |
          desktop/build/libs/*.jar
          server/build/libs/*.jar
          android/build/outputs/apk/release/*.apk
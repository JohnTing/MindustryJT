# .github/workflows/main-release.yml

name: Build and Release - Main

on:
  push:
    branches:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Extract Version, Tag Name, and Timestamp
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^v([0-9.]+).*/\1/')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        UNIQUE_TAG="${BRANCH_NAME}-${TIMESTAMP}"

        echo "Branch name is: $BRANCH_NAME"
        echo "Extracted version for Pbuildversion: $VERSION"
        echo "Timestamp: $TIMESTAMP"
        echo "Full unique tag to be created: $UNIQUE_TAG"
        
        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$UNIQUE_TAG" >> $GITHUB_ENV

    - name: Build Desktop and Server JARs
      # 【修改點】加入 --no-daemon 避免狀態殘留到下一個步驟
      run: ./gradlew desktop:dist server:dist -Pbuildversion=${{ env.BUILD_VERSION }} --no-daemon

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ../bekeystore.jks

    - name: Build Android Release APK
      id: build_android
      continue-on-error: true
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
        keystore_alias: ${{ secrets.KEYSTORE_ALIAS }}
        keystore_alias_password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      # 【修改點】加入 --no-daemon 與 --no-configuration-cache 強制重新解析依賴，解決狀態變更異常
      run: >
        ./gradlew android:assembleRelease
        -Pbuildversion=${{ env.BUILD_VERSION }}
        --stacktrace
        --no-daemon
        --no-configuration-cache

    - name: Upload Android Build Reports on Failure
      if: steps.build_android.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: android-build-reports
        path: android/build/reports/
        retention-days: 7

    - name: Create Release and Upload JARs
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        files: |
          desktop/build/libs/*.jar
          server/build/libs/server-release.jar

    - name: Upload Android Release APK
      if: steps.build_android.outcome == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.RELEASE_TAG }}
        file: android/build/outputs/apk/release/android-release.apk
        asset_name: mindustry-android-release-${{ env.BUILD_VERSION }}.apk
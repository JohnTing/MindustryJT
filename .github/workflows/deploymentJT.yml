# .github/workflows/main-release.yml

name: Build and Release - Main

on:
  push:
    branches:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-v3-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-v3-

    - name: Extract Version, Tag Name, and Timestamp
      id: extract_vars
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^v([0-9.]+).*/\1/')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        UNIQUE_TAG="${BRANCH_NAME}-${TIMESTAMP}"

        echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_TAG=$UNIQUE_TAG" >> $GITHUB_ENV

    # ==========================================
    # 前置準備：Keystore 與 Android ID 修改 (比照原版)
    # ==========================================
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ../bekeystore.jks

    - name: Modify Android Package to Bleeding-Edge
      # 比照原版將 App 改名為 BE 版以便與正式版區分
      # run: |
      #   sed -i 's/applicationId "io.anuke.mindustry"/applicationId "io.anuke.mindustry.be"/g' android/build.gradle
      #   sed -i 's/"io.anuke.mindustry"/"io.anuke.mindustry.be"/g' android/AndroidManifest.xml
      #   sed -i 's/Mindustry/Mindustry BE/g' android/res/values/strings.xml

    # ==========================================
    # 核心步驟：同一次編譯 (跟原版一樣一個指令出所有包)
    # ==========================================
    - name: Build All Artifacts
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
        keystore_alias: ${{ secrets.KEYSTORE_ALIAS }}
        keystore_alias_password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: >
        ./gradlew pack 
        desktop:dist 
        server:dist 
        android:assembleRelease 
        -Pbuildversion=${{ env.BUILD_VERSION }} 
        -PshowCommitHash 
        --stacktrace 
        --no-daemon 
        --no-configuration-cache
      # -PversionType=bleeding-edge 
    # ==========================================
    # 發布流程 (保留 JT 版的發布邏輯)
    # ==========================================
    - name: Create Release and Upload All Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        files: |
          desktop/build/libs/*.jar
          server/build/libs/server-release.jar
          android/build/outputs/apk/release/android-release.apk

    # 如果編譯失敗，上傳 Android 報告供除錯
    - name: Upload Android Build Reports on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-reports
        path: android/build/reports/
        retention-days: 7